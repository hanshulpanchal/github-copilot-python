<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div id="timer" aria-label="Elapsed time">00:00</div>
  <div id="sudoku-board"></div>
  <div class="controls">
    <label for="player-name">Player name:</label>
    <input id="player-name" type="text" maxlength="30" autocomplete="name">
    <label for="difficulty">Difficulty:</label>
    <select id="difficulty">
      <option value="easy" selected>Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button id="theme-toggle" type="button" aria-pressed="false">Dark Mode</button>
    <button id="new-game">New Game</button>
    <button id="hint">Hint</button>
    <button id="check-solution">Check Solution</button>
    <span id="message"></span>
  </div>
  <section id="leaderboard" aria-labelledby="leaderboard-title">
    <h2 id="leaderboard-title">Top 10 Fastest</h2>
    <ol id="leaderboard-list"></ol>
  </section>
  <script src="/static/timer.js"></script>
  <script src="/static/leaderboard.js"></script>
  <script src="/static/theme.js"></script>
  <script src="/static/main.js"></script>
</body>
</html>
